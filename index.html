<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Best One — Project Tracker</title>
<style>
:root{
  --bg:#F6F2EA; --panel:#FFFFFF; --line:#E2D9C8; --grid:#EEE7D8;
  --text:#241C10; --muted:#6B6152; --navy:#142850; --red:#C81E1E; --gold:#B8860F; --ok:#1E8A5F; --warn:#C9660C;
  --civil:#B5502A; --passive:#1B6E8C; --active:#D79A1E;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--bg); }
body{ color:var(--text); font-family: Cambria, Georgia, "Times New Roman", Times, serif; font-size:16px; line-height:1.55; }
#root{ min-height:100vh; padding:24px 28px 60px; max-width:1240px; margin:0 auto; }
.bo-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; padding-bottom:16px; border-bottom:1px solid var(--line); }
.bo-brand{ display:flex; align-items:center; gap:14px; }
.bo-logo{ height:40px; object-fit:contain; }
.bo-brand-sub{ font-size:13px; color:var(--muted); font-weight:500; }
.bo-header-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.bo-btn{ background:var(--panel); border:1px solid var(--line); color:var(--text); padding:9px 15px; border-radius:7px; font-size:13.5px; cursor:pointer; font-weight:500; }
.bo-btn:hover{ border-color:var(--navy); }
.bo-btn-primary{ background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600; }
.bo-btn-primary:hover{ background:#0D1D3B; }
.bo-role-select{ display:flex; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:3px; }
.bo-role-opt{ background:transparent; border:none; color:var(--muted); padding:7px 13px; border-radius:7px; font-size:13px; cursor:pointer; font-weight:500; }
.bo-role-opt-active{ background:var(--navy); color:#fff; }
.bo-logged-in{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 8px 7px 14px; font-weight:500; }
.bo-logged-dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; }
.bo-logout-btn{ padding:5px 11px; font-size:12.5px; }
.bo-pin-error{ font-size:13px; color:var(--red); margin:-8px 0 12px; font-weight:600; }
.bo-tabs{ display:flex; align-items:center; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.bo-tab{ background:transparent; border:1px solid transparent; color:var(--muted); padding:8px 15px; border-radius:20px; font-size:13.5px; cursor:pointer; font-weight:500; display:flex; align-items:center; gap:7px; }
.bo-tab-thumb{ width:18px; height:18px; border-radius:50%; object-fit:cover; }
.bo-tab-active{ background:var(--panel); border-color:var(--line); color:var(--text); box-shadow:0 1px 3px rgba(20,40,80,0.08); font-weight:700; }
.bo-dept-banner{ position:relative; border-radius:12px; overflow:hidden; height:150px; margin-bottom:18px; display:flex; align-items:flex-end; }
.bo-dept-banner img{ position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.62); }
.bo-dept-banner-label{ position:relative; z-index:1; color:#fff; padding:16px 20px; }
.bo-dept-banner-label .bo-code{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; letter-spacing:0.4px; }
.bo-dept-banner-label .bo-title{ font-size:24px; font-weight:700; margin-top:6px; }
.bo-summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:20px; }
.bo-summary-card{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 16px 14px; overflow:hidden; box-shadow:0 1px 2px rgba(20,40,80,0.04); }
.bo-roof{ position:absolute; top:0; left:0; right:0; height:5px; }
.bo-summary-top{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
.bo-summary-thumb{ width:30px; height:30px; border-radius:7px; object-fit:cover; }
.bo-dept-code{ font-size:11px; color:#fff; background:var(--navy); padding:2px 7px; border-radius:4px; font-weight:700; }
.bo-summary-dept{ font-size:14px; color:var(--text); font-weight:600; }
.bo-summary-progress{ display:flex; align-items:baseline; gap:8px; margin-bottom:9px; }
.bo-summary-progress-num{ font-size:30px; font-weight:800; }
.bo-summary-progress-label{ font-size:12px; color:var(--muted); }
.bo-summary-money{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:9px; font-weight:500; }
.bo-over{ color:var(--red); font-weight:700; }
.bo-summary-blockers{ margin-top:7px; font-size:12.5px; color:var(--red); font-weight:600; }
.bo-dim-track{ height:7px; background:var(--grid); border-radius:4px; overflow:hidden; }
.bo-dim-fill{ height:100%; border-radius:4px; }
.bo-dim-ticks{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--muted); margin-top:3px; }
.bo-charts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin-bottom:22px; }
.bo-chart-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; box-shadow:0 1px 2px rgba(20,40,80,0.04); }
.bo-chart-title{ font-size:13.5px; font-weight:700; color:var(--text); margin-bottom:10px; }
.bo-chart-body{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; justify-content:center; min-height:170px; }
.bo-legend{ display:flex; flex-direction:column; gap:7px; font-size:13px; font-weight:500; }
.bo-legend-item{ display:flex; align-items:center; gap:8px; }
.bo-legend-dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
.bo-locked-msg{ color:var(--muted); font-size:13px; font-style:italic; display:flex; align-items:center; justify-content:center; min-height:170px; width:100%; }
.bo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:15px; }
.bo-card{ position:relative; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:19px 17px 12px; cursor:pointer; color:var(--text); display:flex; flex-direction:column; gap:9px; width:100%; font-family:inherit; box-shadow:0 1px 2px rgba(20,40,80,0.04); }
.bo-card-accent{ position:absolute; top:0; left:0; right:0; height:5px; border-radius:10px 10px 0 0; }
.bo-card:hover{ border-color:var(--navy); box-shadow:0 4px 14px rgba(20,40,80,0.12); }
.bo-card-top{ display:flex; align-items:center; justify-content:space-between; }
.bo-card-ref{ font-size:11.5px; color:var(--muted); letter-spacing:0.3px; font-weight:600; }
.bo-status-chip{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; }
.bo-status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.bo-card-name{ font-size:16px; font-weight:700; line-height:1.3; }
.bo-card-meta{ font-size:12px; color:var(--muted); font-weight:500; display:flex; flex-wrap:wrap; gap:4px 10px; }
.bo-card-progress-row{ display:flex; align-items:center; gap:10px; }
.bo-card-progress-num{ font-size:17px; font-weight:800; min-width:40px; }
.bo-card-progress-row .bo-dim{ flex:1; }
.bo-card-blocker{ font-size:12.5px; color:var(--red); font-weight:600; }
.bo-card-money{ font-size:12.5px; color:var(--gold); font-weight:600; }
.bo-card-titleblock{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px; margin-top:4px; letter-spacing:0.4px; font-weight:600; }
.bo-add-card{ border:1.5px dashed var(--line); background:transparent; border-radius:10px; color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:130px; cursor:pointer; font-size:13.5px; width:100%; font-family:inherit; font-weight:600; }
.bo-add-card:hover{ border-color:var(--navy); color:var(--navy); }
.bo-add-plus{ font-size:24px; }
.bo-overlay{ position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(15,25,45,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.bo-pin-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; width:340px; max-width:100%; box-shadow:0 12px 40px rgba(15,25,45,0.25); }
.bo-pin-title{ font-size:16px; font-weight:800; margin-bottom:9px; }
.bo-pin-sub{ font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.55; }
.bo-pin-input{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:7px; color:var(--text); padding:11px 13px; font-size:15px; margin-bottom:14px; }
.bo-pin-actions{ display:flex; justify-content:flex-end; gap:8px; }
.bo-drawer{ background:var(--panel); border:1px solid var(--line); border-radius:14px; width:min(700px,100%); max-height:88vh; overflow-y:auto; padding:26px 28px; box-shadow:0 20px 60px rgba(15,25,45,0.3); }
.bo-drawer-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
.bo-drawer-title{ font-size:21px; font-weight:800; margin-top:5px; }
.bo-close{ background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:7px 13px; font-size:12.5px; cursor:pointer; font-weight:600; }
.bo-meta-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:14px 16px; margin-bottom:20px; }
.bo-meta-item label{ display:block; font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:5px; }
.bo-meta-item input{ width:100%; border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:7px 9px; font-size:13.5px; color:var(--text); }
.bo-meta-item .bo-meta-static{ font-size:14px; font-weight:600; }
.bo-drawer-row{ margin-bottom:20px; }
.bo-section-title{ display:block; font-size:12.5px; color:var(--navy); font-weight:800; margin-bottom:10px; letter-spacing:0.3px; text-transform:uppercase; }
.bo-field-label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:600; }
.bo-slider{ width:100%; margin-bottom:8px; accent-color:var(--navy); height:20px; }
.bo-status-options{ display:flex; gap:8px; flex-wrap:wrap; }
.bo-status-opt{ background:transparent; border:1.5px solid var(--line); color:var(--muted); border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; font-weight:600; }
.bo-status-opt:disabled{ cursor:default; opacity:0.7; }
.bo-fac-cols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.bo-fac-col-title{ font-size:12px; font-weight:700; margin-bottom:8px; }
.bo-fac-col-title.done{ color:var(--ok); }
.bo-fac-col-title.pending{ color:var(--warn); }
.bo-list{ list-style:none; padding:0; margin:0 0 8px; display:flex; flex-direction:column; gap:6px; }
.bo-list-item{ display:flex; align-items:center; justify-content:space-between; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:9px 11px; font-size:13.5px; gap:10px; font-weight:500; }
.bo-blocker-item{ color:#8A2015; background:#FBEAE8; border-color:#F1C6BE; }
.bo-fac-done-item{ background:#EAF6F1; border-color:#C9E6D9; }
.bo-check{ display:flex; align-items:center; gap:8px; }
.bo-task-done{ text-decoration:line-through; color:var(--muted); }
.bo-x{ background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 5px; }
.bo-x:hover{ color:var(--red); }
.bo-empty{ font-size:13px; color:var(--muted); margin-bottom:8px; font-style:italic; }
.bo-inline-add{ display:flex; gap:8px; }
.bo-text-input{ flex:1; background:var(--bg); border:1px solid var(--line); border-radius:7px; color:var(--text); padding:9px 12px; font-size:13.5px; width:100%; }
.bo-issues-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
.bo-issues-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.3px; color:var(--muted); font-weight:700; padding:0 8px 8px; border-bottom:1px solid var(--line); }
.bo-issues-table td{ padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-weight:500; }
.bo-issues-table tr:last-child td{ border-bottom:none; }
.bo-issue-cell{ color:#8A2015; font-weight:600; }
.bo-issue-remove{ text-align:right; }
.bo-issue-form{ display:grid; grid-template-columns:1.3fr 1.3fr 0.9fr 0.9fr auto; gap:8px; margin-top:10px; }
.bo-issue-form input{ background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 9px; font-size:12.5px; width:100%; }
@media (max-width:760px){ .bo-issue-form{ grid-template-columns:1fr 1fr; } .bo-issues-table{ display:none; } .bo-issues-cards{ display:flex !important; } }
.bo-issues-cards{ display:none; flex-direction:column; gap:8px; }
.bo-issue-card{ background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; }
.bo-issue-card b{ color:#8A2015; }
.bo-sites-intro{ font-size:12.5px; color:var(--muted); margin-bottom:12px; line-height:1.5; }
.bo-site-card{ border:1px solid var(--line); border-radius:9px; margin-bottom:10px; overflow:hidden; }
.bo-site-head{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:var(--bg); cursor:pointer; gap:10px; }
.bo-site-head-left{ display:flex; align-items:center; gap:12px; font-weight:700; font-size:13.5px; }
.bo-site-head-right{ display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; color:var(--muted); }
.bo-chevron{ font-size:11px; color:var(--muted); }
.bo-site-body{ padding:16px; border-top:1px solid var(--line); }
.bo-aggregate-note{ font-size:12px; color:var(--muted); font-style:italic; margin-top:6px; }
.bo-cash-figures{ display:flex; gap:24px; margin-bottom:12px; flex-wrap:wrap; }
.bo-cash-num{ font-size:19px; font-weight:800; color:var(--gold); }
.bo-cash-label{ font-size:11.5px; color:var(--muted); font-weight:600; }
.bo-cash-hidden{ font-size:13px; color:var(--muted); font-style:italic; border-top:1px solid var(--line); padding-top:16px; }
.bo-hint{ font-size:12px; color:var(--muted); margin-top:7px; font-style:italic; }
.bo-storage-note{ font-size:12px; color:var(--muted); margin-top:28px; padding-top:16px; border-top:1px solid var(--line); line-height:1.5; }
@media (max-width:760px){ .bo-fac-cols{ grid-template-columns:1fr; } }

/* ---- Standup mode: dark, high-contrast, meeting-room friendly ---- */
.bo-standup{ min-height:100vh; background:radial-gradient(circle at 15% 0%, #1B3868 0%, #101F3D 45%, #0A1730 100%); color:#F4F6FB; display:flex; flex-direction:column; gap:28px; padding:36px 48px 44px; font-family:Cambria, Georgia, "Times New Roman", Times, serif; }
.bo-standup-topbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
.bo-standup-brand{ display:flex; align-items:center; gap:12px; }
.bo-standup-brand img{ height:26px; }
.bo-standup-badge{ background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.16); padding:7px 16px; border-radius:22px; font-size:13.5px; font-weight:600; letter-spacing:0.2px; }
.bo-standup-exit{ background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; padding:9px 16px; border-radius:8px; font-size:13.5px; cursor:pointer; font-weight:600; }
.bo-standup-exit:hover{ background:rgba(255,255,255,0.16); }
.bo-standup-name{ font-size:44px; font-weight:800; letter-spacing:-0.5px; line-height:1.15; }
.bo-standup-meta{ font-size:15px; color:rgba(244,246,251,0.68); font-weight:500; margin-top:6px; }
.bo-standup-hero{ display:flex; align-items:center; gap:44px; flex-wrap:wrap; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:18px; padding:28px 32px; }
.bo-ring-wrap{ position:relative; width:168px; height:168px; flex:0 0 auto; }
.bo-ring-wrap svg{ transform:rotate(-90deg); }
.bo-ring-label{ position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.bo-ring-num{ font-size:38px; font-weight:800; }
.bo-ring-sub{ font-size:11.5px; color:rgba(244,246,251,0.6); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
.bo-standup-status-pill{ display:inline-flex; align-items:center; gap:9px; font-size:16px; font-weight:700; padding:9px 18px; border-radius:24px; }
.bo-standup-hero-right{ flex:1; min-width:220px; display:flex; flex-direction:column; gap:14px; }
.bo-site-chip-row{ display:flex; flex-wrap:wrap; gap:10px; }
.bo-site-chip{ background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); border-radius:10px; padding:9px 13px; min-width:118px; }
.bo-site-chip-num{ font-size:12px; font-weight:700; letter-spacing:0.3px; opacity:0.85; }
.bo-site-chip-pct{ font-size:18px; font-weight:800; margin-top:2px; }
.bo-standup-cols{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.bo-standup-panel{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:22px 24px; }
.bo-standup-panel-title{ font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:rgba(244,246,251,0.65); margin-bottom:14px; }
.bo-standup-item{ background:rgba(255,255,255,0.06); border-radius:10px; padding:12px 14px; margin-bottom:8px; font-size:14.5px; line-height:1.5; }
.bo-standup-item b{ color:#FF9C89; }
.bo-standup-item .bo-standup-item-meta{ font-size:12.5px; color:rgba(244,246,251,0.6); margin-top:4px; font-weight:500; }
.bo-standup-empty{ font-size:14px; color:rgba(244,246,251,0.55); font-style:italic; }
.bo-standup-bottom{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
.bo-standup-navbtn{ background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; padding:11px 22px; border-radius:9px; font-size:14.5px; cursor:pointer; font-weight:700; }
.bo-standup-navbtn:hover{ background:rgba(255,255,255,0.18); }
.bo-standup-dots{ display:flex; gap:7px; }
.bo-dot{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.25); }
.bo-dot-active{ background:#fff; }
@media (max-width:820px){
  .bo-standup{ padding:26px 22px 34px; }
  .bo-standup-name{ font-size:30px; }
  .bo-standup-hero{ padding:20px; gap:24px; }
  .bo-standup-cols{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------------------------------------------------------------
   BEST ONE — project tracking board, standalone offline version.
   Saves to this browser's localStorage (device-only — see the
   note at the bottom of the page for what that means).
----------------------------------------------------------------*/

const DEPARTMENTS = ["Civil", "Passive", "Active"];

// ---------- persistence ----------
function loadProjects() {
  try {
    const raw = localStorage.getItem("bestone_projects_v2");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const seed = seedProjects();
  saveProjects(seed);
  return seed;
}
function saveProjects(projects) { try { localStorage.setItem("bestone_projects_v2", JSON.stringify(projects)); } catch (e) {} }
function loadPasswords() {
  try {
    const raw = localStorage.getItem("bestone_passwords_v2");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { ...DEFAULT_PASSWORDS };
}
function savePasswords(pw) { try { localStorage.setItem("bestone_passwords_v2", JSON.stringify(pw)); } catch (e) {} }

function persist() { saveProjects(STATE.projects); }
function findProject(id) { return STATE.projects.find((p) => p.id === id); }

// ---------- multi-site rollups ----------
function hasSites(p) { return p.sites && p.sites.length > 0; }
function projProgress(p) { return hasSites(p) ? Math.round(p.sites.reduce((s, x) => s + x.progress, 0) / p.sites.length) : p.progress; }
function projStatus(p) {
  if (!hasSites(p)) return p.status;
  if (p.sites.some((s) => s.status === "Delayed")) return "Delayed";
  if (p.sites.some((s) => s.status === "At risk")) return "At risk";
  return "On track";
}
function allIssues(p) {
  const own = p.issues.map((r) => ({ ...r, siteNumber: null }));
  const fromSites = hasSites(p) ? p.sites.flatMap((s) => s.issues.map((r) => ({ ...r, siteNumber: s.siteNumber }))) : [];
  return own.concat(fromSites);
}
function findSite(p, sid) { return (p.sites || []).find((s) => s.id === sid); }

// ---------- small view helpers ----------
function dimensionBar(value, tone) {
  const pct = Math.max(0, Math.min(100, value));
  return `<div class="bo-dim">
    <div class="bo-dim-track"><div class="bo-dim-fill" style="width:${pct}%;background:${tone || "#142850"}"></div></div>
    <div class="bo-dim-ticks"><span>0</span><span>50</span><span>100</span></div>
  </div>`;
}

function pieSVG(data, colors, size) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const r = size / 2 - 4, cx = size / 2, cy = size / 2;
  if (total <= 0) return `<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#ECEEF2"></circle></svg>`;
  let angle = -90, paths = "";
  data.forEach((d, i) => {
    const slice = (d.value / total) * 360;
    if (slice <= 0) return;
    const a1 = angle * Math.PI / 180, a2 = (angle + slice) * Math.PI / 180;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const large = slice > 180 ? 1 : 0;
    if (slice >= 359.99) paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${colors[i]}"></circle>`;
    else paths += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${colors[i]}"></path>`;
    angle += slice;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${r * 0.55}" fill="#FFFFFF"></circle></svg>`;
}

function legend(data, colors, formatter) {
  if (data.length === 0) return `<div class="bo-empty">No data yet.</div>`;
  return `<div class="bo-legend">${data.map((d, i) => `
    <div class="bo-legend-item"><span class="bo-legend-dot" style="background:${colors[i]}"></span>${esc(d.name)} — ${formatter ? formatter(d.value) : d.value}</div>
  `).join("")}</div>`;
}

function fmtDate(s) { return s || "—"; }

              <input id="new-issue-who" placeholder="Who" />
              <input id="new-issue-when" type="date" />
              <button class="bo-btn" data-action="add-issue" data-id="${p.id}">Add</button>
            </div>
          ` : ""}
        </div>

        ${seeMoney ? `
          <div class="bo-drawer-row">
            <span class="bo-section-title">Cash flow</span>
            <div class="bo-cash-figures">
              <div><div class="bo-cash-num">${money(p.spent)}</div><div class="bo-cash-label">spent</div></div>
              <div><div class="bo-cash-num">${money(p.budget)}</div><div class="bo-cash-label">budget</div></div>
              <div><div class="bo-cash-num" style="color:${p.budget - p.spent < 0 ? "#D91F17" : "#B8860F"}">${money(p.budget - p.spent)}</div><div class="bo-cash-label">remaining</div></div>
            </div>
            ${dimensionBar(p.budget ? Math.min(100, (p.spent / p.budget) * 100) : 0, "#B8860F")}
          </div>
        ` : ""}

        ${editMoney ? `
          <div class="bo-drawer-row">
            <label class="bo-field-label">Log money usage</label>
            <div class="bo-inline-add">
              <input type="number" id="budget-input" class="bo-text-input" value="${p.budget}" placeholder="Total budget (TZS)" />
              <input type="number" id="spent-input" class="bo-text-input" value="${p.spent}" placeholder="Amount spent so far (TZS)" />
              <button class="bo-btn" data-action="save-spent" data-id="${p.id}">Save</button>
            </div>
          </div>
        ` : `<div class="bo-cash-hidden">${STATE.role === "viewer" ? "Viewer mode — switch to Project manager or Finance to log updates." : "Money figures are logged by Finance or the CEO."}</div>`}
      </div>
    </div>
  `;
}

function renderNewProjectModal() {
  return `
    <div class="bo-overlay" data-action="overlay-close" data-target="newproject">
      <div class="bo-pin-card" data-stop="1">
        <div class="bo-pin-title">New project</div>
        <input autofocus id="np-name" class="bo-text-input" placeholder="Project name" style="margin-bottom:10px" />
        <input id="np-site" class="bo-text-input" placeholder="Site number (e.g. CV-030)" style="margin-bottom:10px" />
        <div class="bo-status-options" style="margin-bottom:10px" id="np-dept-options" data-selected="Civil">
          ${DEPARTMENTS.map((d, i) => `<button class="bo-status-opt ${i === 0 ? "bo-status-opt-active" : ""}" data-action="np-dept-pick" data-dept="${d}">${d}</button>`).join("")}
        </div>
        <input id="np-budget" class="bo-text-input" placeholder="Budget (TZS)" type="number" />
        <div class="bo-pin-actions">
          <button class="bo-btn" data-action="np-cancel">Cancel</button>
          <button class="bo-btn bo-btn-primary" data-action="np-create">Create</button>
        </div>
      </div>
    </div>
  `;
}

function ringSVG(pct, color, size, stroke) {
  const r = (size - stroke) / 2, c = size / 2, circ = 2 * Math.PI * r;
  const offset = circ * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="${stroke}" />
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" />
  </svg>`;
}

function renderStandup() {
  const p = STATE.projects[STATE.standupIdx];
  if (!p) return `<div class="bo-standup"><div class="bo-standup-empty">No projects to show.</div><button class="bo-standup-exit" data-action="standup-off">Exit</button></div>`;
  const progress = projProgress(p);
  const status = projStatus(p);
  const issues = allIssues(p);
  return `
    <div class="bo-standup">
      <div class="bo-standup-topbar">
        <div class="bo-standup-brand"><img src="${LOGO_SRC}" alt="Best One" /><span class="bo-standup-badge">${p.dept} · ${STATE.standupIdx + 1} of ${STATE.projects.length}</span></div>
        <button class="bo-standup-exit" data-action="standup-off">Exit standup</button>
      </div>

      <div>
        <div class="bo-standup-name">${esc(p.name)}</div>
        <div class="bo-standup-meta">Site ${esc(p.siteNumber || "—")} · Start ${fmtDate(p.startDate)} · End ${fmtDate(p.endDate)}${hasSites(p) ? ` · ${p.sites.length} sites` : ""}</div>
      </div>

      <div class="bo-standup-hero">
        <div class="bo-ring-wrap">
          ${ringSVG(progress, STATUS_COLOR[status], 168, 14)}
          <div class="bo-ring-label"><div class="bo-ring-num">${progress}%</div><div class="bo-ring-sub">Complete</div></div>
        </div>
        <div class="bo-standup-hero-right">
          <span class="bo-standup-status-pill" style="background:${STATUS_COLOR[status]}22;color:${STATUS_COLOR[status]}"><span class="bo-status-dot" style="background:${STATUS_COLOR[status]}"></span>${status}</span>
          ${hasSites(p) ? `
            <div class="bo-site-chip-row">
              ${p.sites.map((s) => `<div class="bo-site-chip"><div class="bo-site-chip-num">${esc(s.siteNumber)}</div><div class="bo-site-chip-pct" style="color:${STATUS_COLOR[s.status]}">${s.progress}%</div></div>`).join("")}
            </div>
          ` : ""}
        </div>
      </div>

      <div class="bo-standup-cols">
        <div class="bo-standup-panel">
          <div class="bo-standup-panel-title">Pending issues &amp; risks</div>
          ${issues.length === 0 ? `<div class="bo-standup-empty">Nothing open.</div>` : issues.map((r) => `
            <div class="bo-standup-item"><b>${esc(r.issue)}</b>${r.siteNumber ? ` <span style="opacity:0.6">(${esc(r.siteNumber)})</span>` : ""}<div>${esc(r.action)}</div><div class="bo-standup-item-meta">${esc(r.who)} · ${fmtDate(r.when)}</div></div>
          `).join("")}
        </div>
        <div class="bo-standup-panel">
          <div class="bo-standup-panel-title">FAC pending</div>
          ${p.facPending.length === 0 ? `<div class="bo-standup-empty">Nothing pending.</div>` : p.facPending.map((t) => `<div class="bo-standup-item">${esc(t.text)}</div>`).join("")}
        </div>
      </div>

      <div class="bo-standup-bottom">
        <button class="bo-standup-navbtn" data-action="standup-prev">← Prev</button>
        <div class="bo-standup-dots">${STATE.projects.map((x, i) => `<span class="bo-dot ${i === STATE.standupIdx ? "bo-dot-active" : ""}"></span>`).join("")}</div>
        <button class="bo-standup-navbtn" data-action="standup-next">Next →</button>
      </div>
    </div>
  `;
}

// ---------- event handling ----------
function attachStandupHandlers() {
  document.getElementById("root").addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const act = el.dataset.action;
    if (act === "standup-off") { STATE.standup = false; render(); }
    if (act === "standup-prev") { STATE.standupIdx = (STATE.standupIdx - 1 + STATE.projects.length) % STATE.projects.length; render(); }
    if (act === "standup-next") { STATE.standupIdx = (STATE.standupIdx + 1) % STATE.projects.length; render(); }
  }, { once: true });
  document.onkeydown = (e) => {
    if (!STATE.standup) return;
    if (e.key === "ArrowRight") { STATE.standupIdx = (STATE.standupIdx + 1) % STATE.projects.length; render(); }
    if (e.key === "ArrowLeft") { STATE.standupIdx = (STATE.standupIdx - 1 + STATE.projects.length) % STATE.projects.length; render(); }
    if (e.key === "Escape") { STATE.standup = false; render(); }
  };
}

let newProjectDept = "Civil";

function attachHandlers() {
  document.onkeydown = null;
  const root = document.getElementById("root");

  root.addEventListener("click", (e) => {
    const stopEl = e.target.closest("[data-stop]");
    const overlayEl = e.target.closest(".bo-overlay");
    if (overlayEl && !stopEl && e.target === overlayEl) {
      const target = overlayEl.dataset.target;
      if (target === "gate") { STATE.gate = null; STATE.pinError = ""; render(); }
      if (target === "settings") { STATE.settingsOpen = false; render(); }
      if (target === "drawer") { STATE.openId = null; render(); }
      if (target === "newproject") { STATE.newProjectOpen = false; render(); }
      return;
    }

    const el = e.target.closest("[data-action]");
    if (!el) return;
    const act = el.dataset.action;
    const id = el.dataset.id;

    if (act === "standup-on") { STATE.standup = true; STATE.standupIdx = 0; render(); return; }
    if (act === "dept-pick") { STATE.dept = el.dataset.dept; render(); return; }
    if (act === "role-pick") {
      const r = el.dataset.role;
      if (r === "viewer") { STATE.role = "viewer"; render(); }
      else { STATE.gate = r; STATE.pinError = ""; render(); document.getElementById("pin-input")?.focus(); }
      return;
    }
    if (act === "log-out") { STATE.role = "viewer"; render(); return; }
    if (act === "gate-cancel") { STATE.gate = null; STATE.pinError = ""; render(); return; }
    if (act === "gate-confirm") {
      const val = document.getElementById("pin-input").value;
      if (val === STATE.passwords[STATE.gate]) { STATE.role = STATE.gate; STATE.gate = null; STATE.pinError = ""; }
      else { STATE.pinError = "That password isn't right. Try again."; }
      render();
      return;
    }
    if (act === "settings-open") { STATE.settingsOpen = true; render(); return; }
    if (act === "settings-cancel") { STATE.settingsOpen = false; render(); return; }
    if (act === "settings-save") {
      const m = document.getElementById("pw-manager").value.trim();
      const f = document.getElementById("pw-finance").value.trim();
      const c = document.getElementById("pw-ceo").value.trim();
      if (!m || !f || !c) { const err = document.getElementById("pw-error"); err.style.display = "block"; err.textContent = "No password field can be empty."; return; }
      STATE.passwords = { manager: m, finance: f, ceo: c };
      savePasswords(STATE.passwords);
      STATE.settingsOpen = false;
      render();
      return;
    }
    if (act === "open-project") { STATE.openId = id; render(); return; }
    if (act === "drawer-close") { STATE.openId = null; render(); return; }
    if (act === "set-status") {
      const p = findProject(id); if (p) { p.status = el.dataset.status; touch(p); persist(); render(); }
      return;
    }
    if (act === "add-fac") {
      const list = el.dataset.list;
      const input = document.getElementById(list === "facDone" ? "new-facdone-input" : "new-facpending-input");
      if (input.value.trim()) { const p = findProject(id); p[list].push({ id: uid(), text: input.value.trim() }); touch(p); persist(); render(); }
      return;
    }
    if (act === "remove-fac") {
      const list = el.dataset.list;
      const p = findProject(id); p[list] = p[list].filter((t) => t.id !== el.dataset.tid); touch(p); persist(); render();
      return;
    }
    if (act === "add-issue") {
      const issue = document.getElementById("new-issue-issue").value.trim();
      const action = document.getElementById("new-issue-action").value.trim();
      const who = document.getElementById("new-issue-who").value.trim();
      const when = document.getElementById("new-issue-when").value;
      if (!issue) return;
      const p = findProject(id); p.issues.push({ id: uid(), issue, action, who, when }); touch(p); persist(); render();
      return;
    }
    if (act === "remove-issue") {
      const p = findProject(id); p.issues = p.issues.filter((r) => r.id !== el.dataset.rid); touch(p); persist(); render();
      return;
    }
    if (act === "toggle-site") {
      const sid = el.dataset.sid;
      STATE.expandedSites[sid] = !STATE.expandedSites[sid];
      render();
      return;
    }
    if (act === "add-site") {
      const input = document.getElementById("new-site-number");
      if (input.value.trim()) {
        const p = findProject(id);
        p.sites = p.sites || [];
        const s = { id: uid(), siteNumber: input.value.trim(), progress: 0, status: "On track", issues: [] };
        p.sites.push(s);
        STATE.expandedSites[s.id] = true;
        touch(p); persist(); render();
      }
      return;
    }
    if (act === "remove-site") {
      const sid = el.dataset.sid;
      const p = findProject(id); p.sites = p.sites.filter((s) => s.id !== sid); touch(p); persist(); render();
      return;
    }
    if (act === "set-site-status") {
      const sid = el.dataset.sid;
      const p = findProject(id); const s = findSite(p, sid); if (s) { s.status = el.dataset.status; touch(p); persist(); render(); }
      return;
    }
    if (act === "add-site-issue") {
      const sid = el.dataset.sid;
      const issue = document.getElementById("new-site-issue-issue-" + sid).value.trim();
      const action = document.getElementById("new-site-issue-action-" + sid).value.trim();
      const who = document.getElementById("new-site-issue-who-" + sid).value.trim();
      const when = document.getElementById("new-site-issue-when-" + sid).value;
      if (!issue) return;
      const p = findProject(id); const s = findSite(p, sid);
      s.issues.push({ id: uid(), issue, action, who, when });
      touch(p); persist(); render();
      return;
    }
    if (act === "remove-site-issue") {
      const sid = el.dataset.sid;
      const p = findProject(id); const s = findSite(p, sid);
      s.issues = s.issues.filter((r) => r.id !== el.dataset.rid);
      touch(p); persist(); render();
      return;
    }
    if (act === "save-spent") {
      const budgetVal = Number(document.getElementById("budget-input").value) || 0;
      const spentVal = Number(document.getElementById("spent-input").value) || 0;
      const p = findProject(id); p.budget = budgetVal; p.spent = spentVal; touch(p); persist(); render();
      return;
    }
    if (act === "new-project-open") { STATE.newProjectOpen = true; newProjectDept = "Civil"; render(); return; }
    if (act === "np-cancel") { STATE.newProjectOpen = false; render(); return; }
    if (act === "np-dept-pick") {
      newProjectDept = el.dataset.dept;
      document.querySelectorAll("#np-dept-options .bo-status-opt").forEach((b) => b.classList.remove("bo-status-opt-active"));
      el.classList.add("bo-status-opt-active");
      return;
    }
    if (act === "np-create") {
      const name = document.getElementById("np-name").value.trim();
      const siteNumber = document.getElementById("np-site").value.trim();
      const budget = Number(document.getElementById("np-budget").value) || 0;
      if (!name) return;
      const p = { id: uid(), dept: newProjectDept, name, siteNumber, startDate: "", endDate: "", progress: 0, budget, spent: 0, status: "On track", facDone: [], facPending: [], issues: [], updated: new Date().toISOString().slice(0, 10) };
      STATE.projects.push(p);
      persist();
      STATE.newProjectOpen = false;
      render();
      return;
    }
  });

  // live progress slider (no full re-render while dragging)
  const slider = document.getElementById("progress-slider");
  if (slider) {
    slider.addEventListener("input", () => { document.getElementById("progress-label").textContent = slider.value; });
    slider.addEventListener("change", () => {
      const p = findProject(slider.dataset.id);
      p.progress = Number(slider.value);
      touch(p); persist(); render();
    });
  }

  document.querySelectorAll(".site-progress-slider").forEach((sl) => {
    sl.addEventListener("input", () => {
      const lbl = document.getElementById("site-progress-label-" + sl.dataset.sid);
      if (lbl) lbl.textContent = sl.value;
    });
    sl.addEventListener("change", () => {
      const p = findProject(sl.dataset.id);
      const s = findSite(p, sl.dataset.sid);
      s.progress = Number(sl.value);
      touch(p); persist(); render();
    });
  });

  // meta fields (site number / dates) commit on blur, no full re-render needed until then
  ["site-number-input", "start-date-input", "end-date-input"].forEach((fid) => {
    const el = document.getElementById(fid);
    if (!el) return;
    el.addEventListener("change", () => {
      const p = findProject(el.dataset.id);
      if (fid === "site-number-input") p.siteNumber = el.value.trim();
      if (fid === "start-date-input") p.startDate = el.value;
      if (fid === "end-date-input") p.endDate = el.value;
      touch(p); persist(); render();
    });
  });

  document.onkeydown = (e) => { if (e.key === "Escape") { STATE.gate = null; STATE.settingsOpen = false; STATE.openId = null; STATE.newProjectOpen = false; render(); } };
}

render();
</script>
